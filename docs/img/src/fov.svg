<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <rect width="1280" height="440" rx="14" fill="#11141a"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(40,40)">
      <text x="0" y="0" font-size="20" font-weight="700" fill="#fff">Stock 16:9 on an ultrawide screen</text>
      <text x="0" y="28" font-size="16" fill="#8a93a6">black bars on both sides</text>
      <rect x="0" y="60" width="370" height="156" rx="6" fill="#000" stroke="#3a4150"/>
      <rect x="46" y="60" width="278" height="156" fill="#2b3240"/>
      <path d="M185 330 L120 250 L250 250 Z" fill="#8a93a6" opacity="0.5"/>
      <circle cx="185" cy="335" r="7" fill="#8a93a6"/>
    </g>
    <g transform="translate(455,40)">
      <text x="0" y="0" font-size="20" font-weight="700" fill="#fff">Wider resolution without the patch</text>
      <text x="0" y="28" font-size="16" fill="#8a93a6">same view, stretched sideways</text>
      <rect x="0" y="60" width="370" height="156" rx="6" fill="#2b3240" stroke="#3a4150"/>
      <ellipse cx="185" cy="138" rx="90" ry="40" fill="none" stroke="#c96a6a" stroke-width="3"/>
      <path d="M185 330 L120 250 L250 250 Z" fill="#c96a6a" opacity="0.5"/>
      <circle cx="185" cy="335" r="7" fill="#c96a6a"/>
    </g>
    <g transform="translate(870,40)">
      <text x="0" y="0" font-size="20" font-weight="700" fill="#fff">This pack</text>
      <text x="0" y="28" font-size="16" fill="#ffb347">same height, more road on the sides</text>
      <rect x="0" y="60" width="370" height="156" rx="6" fill="#2b3240" stroke="#ff7a1a" stroke-width="2"/>
      <circle cx="185" cy="138" r="40" fill="none" stroke="#ffb347" stroke-width="3"/>
      <path d="M185 330 L85 250 L285 250 Z" fill="#ff7a1a" opacity="0.55"/>
      <circle cx="185" cy="335" r="7" fill="#ff7a1a"/>
    </g>
    <text x="640" y="410" text-anchor="middle" font-size="16" fill="#8a93a6">Top: what you see. Bottom: how wide the camera looks, seen from above.</text>
  </g>
</svg>
