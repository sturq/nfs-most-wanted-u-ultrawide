<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker></defs>
  <rect width="1280" height="300" rx="14" fill="#11141a"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(30,60)">
      <rect width="260" height="180" rx="10" fill="#1b1f27" stroke="#3a4150"/>
      <text x="20" y="40" font-size="15" fill="#8a93a6" letter-spacing="2">1  GAME CODE</text>
      <text x="20" y="82" font-size="26" font-weight="700" fill="#fff">Hawaii.rpx</text>
      <text x="20" y="115" font-size="17" fill="#c9d1e0">USA release, update v32</text>
      <text x="20" y="142" font-size="17" fill="#c9d1e0">from your own .wua dump</text>
    </g>
    <g transform="translate(340,60)">
      <rect width="260" height="180" rx="10" fill="#1b1f27" stroke="#3a4150"/>
      <text x="20" y="40" font-size="15" fill="#8a93a6" letter-spacing="2">2  SCAN</text>
      <text x="20" y="82" font-size="26" font-weight="700" fill="#fff">146 × 1.7777778</text>
      <text x="20" y="115" font-size="17" fill="#c9d1e0">16:9 floats in .rodata,</text>
      <text x="20" y="142" font-size="17" fill="#ffb347">76 loaded by game code</text>
    </g>
    <g transform="translate(650,60)">
      <rect width="260" height="180" rx="10" fill="#1b1f27" stroke="#3a4150"/>
      <text x="20" y="40" font-size="15" fill="#8a93a6" letter-spacing="2">3  PATCH</text>
      <text x="20" y="82" font-size="26" font-weight="700" fill="#fff">patches.txt</text>
      <text x="20" y="115" font-size="17" fill="#c9d1e0">76 × .float $aspect</text>
      <text x="20" y="142" font-size="17" fill="#c9d1e0">$aspect = width / height</text>
    </g>
    <g transform="translate(960,60)">
      <rect width="290" height="180" rx="10" fill="#1b1f27" stroke="#ff7a1a" stroke-width="2"/>
      <text x="20" y="40" font-size="15" fill="#8a93a6" letter-spacing="2">4  PLAY</text>
      <text x="20" y="82" font-size="26" font-weight="700" fill="#fff">Cemu at 21:9</text>
      <text x="20" y="115" font-size="17" fill="#c9d1e0">wider view, no stretching,</text>
      <text x="20" y="142" font-size="17" fill="#c9d1e0">no black bars</text>
    </g>
    <path d="M296 150 L334 150" stroke="#ff7a1a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M606 150 L644 150" stroke="#ff7a1a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M916 150 L954 150" stroke="#ff7a1a" stroke-width="3" marker-end="url(#a)"/>
  </g>
</svg>
